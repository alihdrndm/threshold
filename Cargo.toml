[workspace]
resolver = "2"
members = ["src-tauri", "crates/threshold-helper", "crates/threshold-protocol"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
