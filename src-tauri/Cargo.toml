[package]
name = "threshold"
version = "0.1.0"
edition = "2021"

[lib]
name = "threshold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
threshold-protocol = { path = "../crates/threshold-protocol" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_StationsAndDesktops"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
dirs = "6.0.0"

# Deferred deliberately:
#   Phase 1 — windows crate (Win32_UI_WindowsAndMessaging, Win32_System_RemoteDesktop,
#             Win32_System_Power) for the hidden message window.
#   Phase 2 — rusqlite (bundled) rather than tauri-plugin-sql: streak, debounce and
#             lock-expiry logic all run with no webview alive, so a JS-facing SQL
#             plugin would mean IPC to a window that may not exist.
